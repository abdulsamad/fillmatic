name: Build & Publish to Chrome Web Store

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-web-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter extension run test

      - name: Build extension for browser tests
        run: pnpm --filter extension run build

      - name: Install Playwright Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Run real-browser extension tests
        run: pnpm --filter extension run test:e2e:run

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    outputs:
      artifact-name: ${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}
      zip-file: ${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set Node.js 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const { version } = require("./package.json")
            const expected = `v${version}`
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Release tag ${process.env.RELEASE_TAG} must match ${expected}`)
              process.exit(1)
            }
          '

      - name: Build extension
        run: pnpm run build:extension

      - name: Get package info
        id: package
        run: |
          node -e '
            const fs = require("node:fs")
            const { name, version } = require("./package.json")
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\nversion=${version}\n`)
          '

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}
          path: ./deploy/*.zip
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./deploy

      - name: Upload and publish to Chrome Web Store
        env:
          CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEB_STORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
        run: npx --yes chrome-webstore-upload-cli@3.5.0 --source ./deploy/${{ needs.build.outputs.zip-file }} --max-await-in-progress 300
