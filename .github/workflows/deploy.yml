name: Extension Continuos Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build and zip the build (dist) folder
        run: pnpm run build && pnpm run postbuild

      - name: Get package info
        uses: codex-team/action-nodejs-package-info@v1.1
        id: package

      - name: Upload & release
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ./deploy/${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}.zip
          extension-id: hogefuga(${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }})
          client-id: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          publish: false
