name: Extension Continuos Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build and zip the build (dist) folder
        run: pnpm run build && pnpm run postbuild

      - name: Get package info
        uses: codex-team/action-nodejs-package-info@v1.1
        id: package

      - name: Upload extension to Chrome Web Store
        uses: mobilefirstllc/cws-publish@latest
        with:
          action: "upload"
          client_id: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
          zip_file: ./deploy/${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}.zip
