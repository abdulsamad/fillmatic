name: Test

on:
  push:
    branches:
      - main
    paths:
      - "apps/extension/**"
      - "packages/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "apps/extension/**"
      - "packages/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm --filter extension run test:coverage

      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: apps/extension

      - name: Generate coverage badge
        run: pnpm --filter extension run coverage:badge

      - name: Commit updated coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- apps/extension/coverage-badge.svg; then
            echo "Badge unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/extension/coverage-badge.svg
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
