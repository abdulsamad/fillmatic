name: Test

on:
  pull_request:
    paths:
      - "apps/extension/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set Node.js 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm --filter extension run test:coverage

      # This data is consumed by the separate, privileged coverage-report
      # workflow. It is intentionally treated as untrusted there: this job is
      # the only place that checks out and runs pull-request code.
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a5 # v7
        with:
          name: coverage-report
          path: |
            apps/extension/coverage
            apps/extension/vitest.config.ts
          retention-days: 3

      - name: Build extension for browser tests
        run: pnpm --filter extension run build

      - name: Install Playwright Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Run real-browser extension tests
        run: pnpm --filter extension run test:e2e:run

      - name: Generate coverage badge
        run: pnpm --filter extension run coverage:badge

      - name: Upload generated coverage badge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-badge-${{ github.event.pull_request.number }}
          path: apps/extension/coverage-badge.svg
          retention-days: 3
