name: Test

on:
  pull_request:
    paths:
      - "apps/extension/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the PR branch itself (not the detached merge commit) so
          # the coverage badge can be committed back to it.
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set Node.js 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm --filter extension run test:coverage

      - name: Build extension for browser tests
        run: pnpm --filter extension run build

      - name: Install Playwright Chromium
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Run real-browser extension tests
        run: pnpm --filter extension run test:e2e:run

      - name: Report coverage on PR
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: apps/extension

      - name: Generate coverage badge
        run: pnpm --filter extension run coverage:badge

      - name: Commit updated coverage badge
        run: |
          # Stage first so a missing/untracked badge counts as a change —
          # plain `git diff` can't see untracked files.
          git add apps/extension/coverage-badge.svg
          if git diff --cached --quiet; then
            echo "Badge unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
